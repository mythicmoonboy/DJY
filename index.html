<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>DJY MLBB HUB</title>
    <script src="https://cdn.jsdelivr.net"></script>
    <style>
        :root { --n: #ff003c; --bg: #0a0a0a; --c: #151515; --g: 0 0 15px #ff003c; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        nav, .bracket-topbar { background: #000; padding: 0 20px; border-bottom: 2px solid var(--n); box-shadow: var(--g); position: sticky; top: 0; z-index: 1000; display: flex; align-items: center; justify-content: space-between; height: 54px; }
        .nav-btn, .b-tab, .modal-tab { background: none; border: none; color: #aaa; font: bold 12px sans-serif; padding: 8px 16px; cursor: pointer; text-transform: uppercase; border-radius: 8px; transition: 0.2s; }
        .nav-active, .nav-btn:hover, .b-tab.active, .modal-tab.active { color: var(--n); }
        #nav-login-btn, #nav-logout-btn, .btn-neon, .tc-btn { border: 1.5px solid var(--n); color: #fff; font: bold 12px sans-serif; padding: 7px 18px; border-radius: 10px; cursor: pointer; text-transform: uppercase; background: none; transition: 0.2s; }
        .btn-neon:hover, #nav-login-btn:hover { background: var(--n); box-shadow: var(--g); }
        .container { max-width: 900px; margin: 30px auto; padding: 20px; display: none; animation: f .4s; }
        .active { display: block; } @keyframes f { from { opacity:0; transform:translateY(10px); } }
        .hero, .tourney-card { border: 1px solid #222; border-radius: 20px; padding: 30px; text-align: center; }
        .tourney-card { background: var(--c); border-left: 6px solid var(--n); text-align: left; margin-bottom: 15px; transition: 0.3s; cursor: pointer; }
        .tourney-card:hover { transform: translateX(10px); background: #202020; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #444; color: #fff; border-radius: 12px; }
        #popup-overlay, #login-modal-overlay, #bracket-screen { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 5000; align-items: center; justify-content: center; }
        #bracket-screen { flex-direction: column; background: #060606; align-items: stretch; }
        .rounds-wrap { display: flex; overflow: auto; padding: 24px; gap: 10px; }
        .match-card { background: #0f0f0f; border: 1px solid #222; border-radius: 10px; margin: 5px; min-width: 160px; }
        .team-slot { padding: 8px; border-bottom: 1px solid #161616; display: flex; justify-content: space-between; font-size: 13px; }
        .dragging { opacity: 0.3; } .drag-over { background: rgba(255,0,60,0.2); }
        #team-panel { display: none; position: fixed; right: 0; top: 0; width: 280px; height: 100%; background: #0c0c0c; border-left: 1px solid #222; padding: 20px; z-index: 6000; overflow-y: auto; }
    </style>
</head>
<body onload="initApp()">

<div id="popup-overlay"><div id="popup-box"><div id="popup-icon"></div><h2 id="popup-title"></h2><p id="popup-msg"></p><button id="popup-ok" class="btn-neon">OK</button></div></div>

<div id="login-modal-overlay">
    <div id="login-modal">
        <h2 style="color:var(--n)">ADMIN</h2>
        <input id="adm-u" placeholder="User"><input id="adm-p" type="password" placeholder="Pass">
        <button class="btn-neon" style="width:100%" onclick="login()">LOGIN</button>
        <button onclick="closeLoginModal()" style="background:none; border:none; color:#555; margin-top:10px; cursor:pointer">Cancel</button>
    </div>
</div>

<nav>
    <div class="nav-links">
        <button class="nav-btn nav-active" onclick="tab('home')">Home</button>
        <button class="nav-btn" onclick="tab('tournament')">Tournament</button>
        <button id="nav-admin-btn" class="nav-btn" style="display:none" onclick="tab('admin')">Admin</button>
    </div>
    <div class="nav-right"><button id="nav-login-btn" onclick="openLoginModal()">Login</button><button id="nav-logout-btn" onclick="logout()" style="display:none">Logout</button></div>
</nav>

<div id="home" class="container active"><div class="hero"><h1>DJY MLBB</h1><button class="btn-neon">Discord</button></div></div>

<div id="tournament" class="container">
    <div style="display:flex; gap:10px; justify-content:center; margin-bottom:20px">
        <button class="btn-neon" onclick="loadData('upcoming')">Upcoming</button>
        <button class="btn-neon" onclick="loadData('live')">Live</button>
        <button class="btn-neon" onclick="loadData('finished')">Finished</button>
    </div>
    <div id="list-display"></div>
</div>

<div id="admin" class="container">
    <div class="hero">
        <h2 id="welcome-msg"></h2>
        <input id="t-name" placeholder="Name"><input id="t-prize" placeholder="Prize">
        <select id="t-size"><option value="8">8</option><option value="16">16</option><option value="32" selected>32 Teams</option></select>
        <button class="btn-neon" style="width:100%" onclick="uploadTournament()">Publish</button>
    </div>
    <div id="moonboi-ctrl" style="display:none; border:2px solid gold; padding:20px; margin-top:20px; border-radius:20px">
        <h3 style="color:gold">Head Admin</h3>
        <button class="btn-neon" style="border-color:gold; color:gold" onclick="generateNewKey()">Gen Key</button>
        <div id="generated-key-wrap" style="display:none"><input id="generated-key-display" readonly></div>
        <div id="key-list-box" style="margin-top:15px"></div>
    </div>
</div>

<div id="bracket-screen">
    <div class="bracket-topbar">
        <h2 id="b-title" style="font-size:14px">BRACKET</h2>
        <div class="nav-links">
            <button class="b-tab active" onclick="switchBTab('winners',this)">Winners</button>
            <button class="b-tab" onclick="switchBTab('losers',this)">Losers</button>
        </div>
        <button class="nav-btn" onclick="toggleTeamPanel()">Teams</button>
        <button class="nav-btn" onclick="closeBracket()">Close</button>
    </div>
    <div class="rounds-wrap" id="b-content"></div>
</div>

<div id="team-panel"><h3>Edit Teams</h3><button class="btn-neon" onclick="saveTeams()">Save</button><div id="team-inputs"></div></div>

<script>
const S_URL = 'https://yfsjflymbkbfiketvxof.supabase.co', S_KEY = 'sb_publishable_bOr8dIV2-Zt_9CUpboVsBQ_pzwpyRZw';
const _s = supabase.createClient(S_URL, S_KEY);
const $ = id => document.getElementById(id);
let isAdmin = false, isHead = false, currentTid = null, teams = [], dragSrc = null;

const initApp = () => {
    const s = localStorage.getItem('djy_session');
    if(s) setLoggedIn(JSON.parse(s));
    loadData('upcoming');
};

const setLoggedIn = (u) => {
    isAdmin = true; isHead = u.isHead;
    $('nav-login-btn').style.display='none'; $('nav-logout-btn').style.display=$('nav-admin-btn').style.display='block';
    $('welcome-msg').innerText = `Welcome, ${u.name}`;
    if(isHead) { $('moonboi-ctrl').style.display='block'; fetchKeys(); }
};

const login = async () => {
    const u=$('adm-u').value, p=$('adm-p').value;
    if(u==='moonboi' && p==='123') return saveSession(true, u);
    const {data} = await _s.from('admin_accounts').select('*').eq('username',u).eq('password',p);
    data?.length ? saveSession(false, u) : alert('Invalid');
};

const saveSession = (h, n) => { localStorage.setItem('djy_session', JSON.stringify({isHead:h, name:n})); location.reload(); };
const logout = () => { localStorage.removeItem('djy_session'); location.reload(); };

const tab = (id) => {
    document.querySelectorAll('.container').forEach(c=>c.classList.remove('active'));
    $(id).classList.add('active');
};

const uploadTournament = async () => {
    const n=$('t-name').value, s=parseInt($('t-size').value);
    const tl = Array.from({length:s},(_,i)=>`Team ${i+1}`);
    const {error} = await _s.from('tournaments').insert([{title:n, team_size:s, status:'upcoming', teams:JSON.stringify(tl)}]);
    if(!error) { alert('Published!'); loadData('upcoming'); }
};

async function loadData(f) {
    const {data} = await _s.from('tournaments').select('*').eq('status',f).order('created_at',{ascending:false});
    $('list-display').innerHTML = data?.map(t => `
        <div class="tourney-card" onclick="openBracket('${t.id}','${t.title}','${encodeURIComponent(t.teams)}')">
            <h3>${t.title}</h3><small>${t.team_size} Teams • ${t.status}</small>
        </div>`).join('') || 'None';
}

function openBracket(id, title, tJson) {
    currentTid = id; teams = JSON.parse(decodeURIComponent(tJson));
    $('b-title').innerText = title; $('bracket-screen').style.display = 'flex';
    renderWinners();
}

const renderWinners = () => {
    const c = $('b-content'); c.innerHTML='';
    const r1 = Array.from({length:8},(_,i)=>makeCard(i*2,i*2+1,`M${i+1}`));
    c.append(makeRound('Round 1', r1));
};

const makeRound = (ttl, cards) => {
    const col = Object.assign(document.createElement('div'), {innerHTML:`<div style="text-align:center;font-size:10px;color:#444">${ttl}</div>`});
    cards.forEach(card => col.append(card)); return col;
};

function makeCard(t1, t2, lbl) {
    const div = Object.assign(document.createElement('div'), {className:'match-card', innerHTML:`<div style="font-size:9px;padding:4px;color:#333">${lbl}</div>`});
    div.append(makeSlot(t1), makeSlot(t2)); return div;
}

function makeSlot(idx) {
    const s = Object.assign(document.createElement('div'), {className:'team-slot', draggable:isAdmin});
    s.innerHTML = `<span>${teams[idx] || 'TBD'}</span>`;
    if(isAdmin) {
        s.ondragstart = () => dragSrc = idx;
        s.ondragover = e => e.preventDefault();
        s.ondrop = () => { [teams[dragSrc], teams[idx]] = [teams[idx], teams[dragSrc]]; renderWinners(); };
    }
    return s;
}

const generateNewKey = async () => {
    const k = 'DJY-'+Math.random().toString(36).substring(2,8).toUpperCase();
    await _s.from('invite_keys').insert([{key:k, used:false}]);
    fetchKeys();
};

const fetchKeys = async () => {
    const {data} = await _s.from('invite_keys').select('*').order('created_at',{ascending:false});
    $('key-list-box').innerHTML = data?.map(k => `<div>${k.key} - ${k.used?'USED':'LIVE'}</div>`).join('');
};

const saveTeams = async () => {
    await _s.from('tournaments').update({teams:JSON.stringify(teams)}).eq('id',currentTid);
    alert('Saved');
};

const openLoginModal = () => $('login-modal-overlay').style.display='flex';
const closeLoginModal = () => $('login-modal-overlay').style.display='none';
const closeBracket = () => $('bracket-screen').style.display='none';
const toggleTeamPanel = () => {
    const p=$('team-panel'), d = p.style.display==='block';
    p.style.display=d?'none':'block';
    if(!d) $('team-inputs').innerHTML = teams.map((t,i)=>`<input value="${t}" oninput="teams[${i}]=this.value">`).join('');
};

_s.channel('any').on('postgres_changes',{event:'*',schema:'public',table:'tournaments'},()=>loadData('upcoming')).subscribe();
</script>
</body>
</html>
