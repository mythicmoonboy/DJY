<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>DJY MLBB HUB</title>
    <script src="https://cdn.jsdelivr.net"></script>
    <style>
        :root { --n: #ff003c; --bg: #0a0a0a; --c: #151515; --g: 0 0 15px #ff003c; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }
        nav { background: #000; padding: 0 20px; border-bottom: 2px solid var(--n); box-shadow: var(--g); position: sticky; top: 0; z-index: 1000; display: flex; align-items: center; justify-content: space-between; height: 54px; }
        .nav-btn { background: none; border: none; color: #aaa; font-weight: bold; padding: 8px 16px; cursor: pointer; text-transform: uppercase; transition: 0.2s; font-size: 13px; border-radius: 8px; }
        .nav-active, .nav-btn:hover { color: var(--n); }
        #nav-login-btn, #nav-logout-btn { border: 1.5px solid var(--n); color: var(--n); padding: 7px 18px; border-radius: 10px; cursor: pointer; text-transform: uppercase; font-size: 12px; font-weight: bold; background: none; }
        #nav-login-btn:hover, #nav-logout-btn:hover { background: var(--n); color: #fff; box-shadow: var(--g); }
        .btn-neon { border: 2px solid var(--n); color: #fff; font-weight: bold; background: none; cursor: pointer; border-radius: 12px; padding: 12px 24px; text-transform: uppercase; transition: 0.2s; }
        .btn-neon:hover { background: var(--n); box-shadow: var(--g); }
        .container { max-width: 900px; margin: 30px auto; padding: 20px; display: none; }
        .active { display: block; animation: f .4s; } @keyframes f { from { opacity: 0; transform: translateY(10px); } }
        .tourney-card { background: var(--c); border-left: 6px solid var(--n); padding: 20px; margin-bottom: 15px; border-radius: 15px; border: 1px solid #222; transition: 0.3s; cursor: pointer; }
        .tourney-card:hover { transform: translateX(10px); background: #202020; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #444; color: #fff; border-radius: 12px; }
        #popup-overlay, #login-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 5000; align-items: center; justify-content: center; }
        .show { display: flex !important; }
        #popup-box, #login-modal { background: #111; border: 1px solid var(--n); border-radius: 20px; padding: 30px; width: 90%; max-width: 400px; text-align: center; }
        #bracket-screen { display: none; position: fixed; inset: 0; background: #060606; z-index: 3000; flex-direction: column; }
        .rounds-wrap { display: flex; overflow: auto; padding: 24px; gap: 10px; }
        .match-card { background: #0f0f0f; border: 1px solid #222; border-radius: 10px; margin: 5px; min-width: 160px; }
        .team-slot { padding: 8px; display: flex; justify-content: space-between; border-bottom: 1px solid #161616; font-size: 13px; }
        .key-item { display: flex; justify-content: space-between; background: #111; padding: 10px; border: 1px solid #222; margin: 5px 0; border-radius: 10px; }
    </style>
</head>
<body onload="initApp()">

<div id="popup-overlay"><div id="popup-box"><div id="popup-icon"></div><h2 id="popup-title"></h2><p id="popup-msg"></p><button id="popup-ok" class="btn-neon">OK</button></div></div>

<div id="login-modal-overlay">
    <div id="login-modal">
        <h2 style="color:var(--n)">ADMIN</h2>
        <input id="adm-u" placeholder="User"><input id="adm-p" type="password" placeholder="Pass">
        <button class="btn-neon" style="width:100%" onclick="login()">LOGIN</button>
        <button onclick="closeLoginModal()" style="background:none; border:none; color:#555; margin-top:10px; cursor:pointer">Cancel</button>
    </div>
</div>

<nav>
    <div class="nav-links">
        <button class="nav-btn nav-active" onclick="tab('home')">Home</button>
        <button class="nav-btn" onclick="tab('tournament')">Tournament</button>
        <button id="nav-admin-btn" class="nav-btn" style="display:none" onclick="tab('admin')">Admin</button>
    </div>
    <div class="nav-right">
        <button id="nav-login-btn" onclick="openLoginModal()">Login</button>
        <button id="nav-logout-btn" onclick="logout()">Logout</button>
    </div>
</nav>

<div id="home" class="container active">
    <div class="hero" style="text-align:center; padding:50px; border:1px solid var(--n); border-radius:20px;">
        <h1 style="color:var(--n); font-size:3rem">DJY MLBB</h1>
        <p>Real-time Tournament Management</p>
        <button class="btn-neon">Discord</button>
    </div>
</div>

<div id="tournament" class="container">
    <div style="display:flex; gap:10px; justify-content:center; margin-bottom:20px">
        <button class="btn-neon" onclick="loadData('upcoming')">Upcoming</button>
        <button class="btn-neon" onclick="loadData('live')">Live</button>
        <button class="btn-neon" onclick="loadData('finished')">Finished</button>
    </div>
    <div id="list-display"></div>
</div>

<div id="bracket-screen">
    <div style="display:flex; justify-content:space-between; padding:15px; border-bottom:1px solid #222">
        <h2 id="b-title" style="color:var(--n); margin:0">Bracket</h2>
        <button class="btn-neon" style="padding:5px 15px" onclick="closeBracket()">Close</button>
    </div>
    <div class="rounds-wrap" id="winners-rounds"></div>
</div>

<div id="admin" class="container">
    <div id="dashboard">
        <h2>Post Tournament</h2>
        <input id="t-name" placeholder="Name"><input id="t-prize" placeholder="Prize">
        <select id="t-status"><option value="upcoming">Upcoming</option><option value="live">Live</option></select>
        <button class="btn-neon" style="width:100%" onclick="uploadTournament()">Publish</button>
    </div>
    <div id="moonboi-ctrl" style="display:none; border:2px solid gold; padding:20px; margin-top:20px; border-radius:20px">
        <h3 style="color:gold">Moonboi Control</h3>
        <button class="btn-neon" style="border-color:gold; color:gold" onclick="generateNewKey()">Gen Key</button>
        <div id="key-list-box"></div>
    </div>
</div>

<script>
const S_URL = 'https://yfsjflymbkbfiketvxof.supabase.co', S_KEY = 'sb_publishable_bOr8dIV2-Zt_9CUpboVsBQ_pzwpyRZw';
const _s = supabase.createClient(S_URL, S_KEY);
const $ = id => document.getElementById(id);
let isAdmin = false, teams = [], dragSrc = null, currentTid = null;

function initApp() {
    const s = localStorage.getItem('djy_session');
    if(s) setLoggedIn(JSON.parse(s));
    loadData('upcoming');
}

function setLoggedIn(u) {
    isAdmin = true;
    $('nav-login-btn').style.display='none'; $('nav-logout-btn').style.display='block';
    $('nav-admin-btn').style.display='block';
    if(u.isHead) $('moonboi-ctrl').style.display='block', fetchKeys();
}

async function login() {
    const u = $('adm-u').value, p = $('adm-p').value;
    if(u==='moonboi' && p==='123') return saveSession(true, u);
    const {data} = await _s.from('admin_accounts').select('*').eq('username',u).eq('password',p);
    data?.length ? saveSession(false, u) : alert('Invalid');
}

function saveSession(h, n) {
    localStorage.setItem('djy_session', JSON.stringify({isHead:h, name:n}));
    location.reload();
}

function logout() { localStorage.removeItem('djy_session'); location.reload(); }

function tab(id) {
    document.querySelectorAll('.container').forEach(c=>c.classList.remove('active'));
    $(id).classList.add('active');
}

async function loadData(f) {
    const {data} = await _s.from('tournaments').select('*').eq('status',f);
    $('list-display').innerHTML = data?.map(t => `
        <div class="tourney-card" onclick="openBracket('${t.id}','${t.title}','${encodeURIComponent(t.teams)}')">
            <h3>${t.title}</h3><p>Prize: ${t.prize}</p>
        </div>`).join('') || 'No tournaments';
}

function openBracket(id, title, tJson) {
    currentTid = id; $('b-title').innerText = title;
    teams = JSON.parse(decodeURIComponent(tJson)) || Array.from({length:32},(_,i)=>`Team ${i+1}`);
    $('bracket-screen').classList.add('show');
    renderWinners();
}

function closeBracket() { $('bracket-screen').classList.remove('show'); }

function makeSlot(idx) {
    const d = document.createElement('div'); d.className='team-slot';
    d.innerHTML = `<span>${idx>=0?teams[idx]:'TBD'}</span>`;
    if(isAdmin && idx>=0) {
        d.draggable = true;
        d.ondragstart = () => dragSrc = idx;
        d.ondragover = e => e.preventDefault();
        d.ondrop = () => {
            [teams[dragSrc], teams[idx]] = [teams[idx], teams[dragSrc]];
            _s.from('tournaments').update({teams:JSON.stringify(teams)}).eq('id',currentTid).then(renderWinners);
        };
    }
    return d;
}

function renderWinners() {
    const c = $('winners-rounds'); c.innerHTML='';
    [16,8,4,2,1].forEach((count, rIdx) => {
        const col = document.createElement('div'); col.className='round-col';
        col.innerHTML = `<div style="text-align:center; font-size:10px; color:#444">Round ${rIdx+1}</div>`;
        for(let i=0; i<count; i++) {
            const card = document.createElement('div'); card.className='match-card';
            card.append(makeSlot(rIdx===0?i*2:-1), makeSlot(rIdx===0?i*2+1:-1));
            col.append(card);
        }
        c.append(col);
    });
}

async function generateNewKey() {
    const k = 'DJY-'+Math.random().toString(36).substring(2,8).toUpperCase();
    await _s.from('invite_keys').insert([{key:k, used:false}]);
    fetchKeys();
}

async function fetchKeys() {
    const {data} = await _s.from('invite_keys').select('*').order('created_at',{ascending:false});
    $('key-list-box').innerHTML = data?.map(k => `
        <div class="key-item"><span>${k.key}</span><strong>${k.used?'USED':'LIVE'}</strong></div>
    `).join('');
}

function openLoginModal() { $('login-modal-overlay').classList.add('show'); }
function closeLoginModal() { $('login-modal-overlay').classList.remove('show'); }

_s.channel('any').on('postgres_changes',{event:'*',schema:'public',table:'tournaments'},()=>loadData('live')).subscribe();
</script>
</body>
</html>
