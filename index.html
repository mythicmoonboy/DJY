<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DJY MLBB HUB</title>
    <script src="https://cdn.jsdelivr.net"></script>
    <style>
        :root { --neon: #ff003c; --bg: #0a0a0a; --card: #151515; --glow: 0 0 15px #ff003c; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: white; font-family: 'Segoe UI', sans-serif; margin: 0; overflow-x: hidden; }

        /* ── NAV ── */
        nav { background: #000; padding: 0 20px; border-bottom: 2px solid var(--neon); box-shadow: var(--glow); position: sticky; top: 0; z-index: 1000; display: flex; align-items: center; justify-content: space-between; height: 54px; }
        .nav-links { display: flex; align-items: center; gap: 4px; }
        nav button.nav-btn { background: none; border: none; color: #aaa; font-weight: bold; padding: 8px 16px; cursor: pointer; text-transform: uppercase; transition: 0.2s; font-size: 13px; border-radius: 8px; letter-spacing: 0.5px; }
        nav button.nav-btn:hover { color: white; }
        nav button.nav-btn.nav-active { color: var(--neon); }
        .nav-right { display: flex; align-items: center; gap: 10px; }
        #nav-login-btn { background: none; border: 1.5px solid var(--neon); color: var(--neon); font-weight: bold; font-size: 12px; padding: 7px 18px; border-radius: 10px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s; display: block; }
        #nav-login-btn:hover { background: var(--neon); color: white; box-shadow: var(--glow); }
        #nav-logout-btn { background: rgba(255,0,60,0.1); border: 1.5px solid rgba(255,0,60,0.4); color: #ff4466; font-weight: bold; font-size: 12px; padding: 7px 18px; border-radius: 10px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: all 0.2s; display: none; }
        #nav-logout-btn:hover { background: var(--neon); color: white; box-shadow: var(--glow); }
        #nav-user-label { display: none; color: #555; font-size: 12px; font-weight: bold; letter-spacing: 1px; text-transform: uppercase; }

        button:active { transform: scale(0.93); }
        .btn-neon { display: inline-block; padding: 12px 24px; border: 2px solid var(--neon); color: white; font-weight: bold; background: none; cursor: pointer; transition: all 0.2s ease; border-radius: 12px; text-transform: uppercase; }
        .btn-neon:hover { background: var(--neon); box-shadow: var(--glow); }

        .container { max-width: 900px; margin: 30px auto; padding: 20px; display: none; }
        .active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .hero { text-align: center; padding: 40px; border: 1px solid var(--neon); background: rgba(255,0,60,0.05); border-radius: 20px; }
        .tourney-card { background: var(--card); border-left: 6px solid var(--neon); padding: 20px; margin-bottom: 15px; border-radius: 15px; cursor: pointer; transition: 0.3s; border: 1px solid #222; }
        .tourney-card:hover { transform: translateX(10px); background: #202020; }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; background: #000; border: 1px solid #444; color: white; border-radius: 12px; font-size: 14px; }
        .manage-item { display: flex; justify-content: space-between; align-items: center; background: #1a1a1a; padding: 15px; margin: 10px 0; border-radius: 12px; border: 1px solid #333; }

        /* MODALS */
        #login-modal-overlay, #popup-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 5000; justify-content: center; align-items: center; }
        #login-modal, #popup-box { background: #111; border: 1px solid var(--neon); border-radius: 20px; padding: 36px 32px; width: 90%; max-width: 400px; position: relative; }
        #bracket-screen { display: none; position: fixed; inset: 0; background: #060606; z-index: 3000; flex-direction: column; }
        .rounds-wrap { display: flex; overflow: auto; padding: 24px; gap: 10px; }
        .match-card { background: #0f0f0f; border: 1px solid #222; border-radius: 10px; margin: 5px 8px; min-width: 162px; }
        .team-slot { padding: 8px 10px; border-bottom: 1px solid #161616; display: flex; justify-content: space-between; font-size: 13px; }
    </style>
</head>
<body onload="initApp()">

<div id="popup-overlay"><div id="popup-box"><div id="popup-icon"></div><h2 id="popup-title"></h2><p id="popup-msg"></p><button id="popup-ok" class="btn-neon" onclick="closePopup()">OK</button></div></div>

<nav>
    <div class="nav-links">
        <button class="nav-btn nav-active" onclick="tab('home')">Home</button>
        <button class="nav-btn" onclick="tab('tournament')">Tournament</button>
        <button class="nav-btn" onclick="tab('register')">Register Squad</button>
        <button id="nav-admin-btn" class="nav-btn" style="display:none;" onclick="tab('admin')">Admin</button>
    </div>
    <div class="nav-right">
        <span id="nav-user-label"></span>
        <button id="nav-login-btn" onclick="openLoginModal()">Login</button>
        <button id="nav-logout-btn" onclick="logout()">Logout</button>
    </div>
</nav>

<div id="home" class="container active">
    <div class="hero"><h1>DJY MLBB HUB</h1><p>Real-time Tournament Dashboard</p></div>
</div>

<div id="register" class="container">
    <div class="hero">
        <h2 style="color:var(--neon)">SQUAD REGISTRATION</h2>
        <input id="reg-team-name" placeholder="Team Name">
        <input id="reg-captain-ign" placeholder="Captain IGN">
        <input id="reg-captain-id" placeholder="Game ID (e.g. 12345678)">
        <input id="reg-contact" placeholder="WhatsApp Number">
        <textarea id="reg-members" placeholder="List Member IGNs (One per line)" rows="5"></textarea>
        <button class="btn-neon" style="width:100%" onclick="submitRegistration()">SUBMIT ENTRY</button>
        <p id="reg-msg" style="margin-top:10px"></p>
    </div>
</div>
<div id="tournament" class="container">
    <div style="text-align:center; margin-bottom:20px;">
        <button class="btn-neon" onclick="loadData('upcoming')">Upcoming</button>
        <button class="btn-neon" onclick="loadData('live')">Live</button>
    </div>
    <div id="list-display"></div>
</div>

<div id="admin" class="container">
    <div id="dashboard">
        <h2 id="welcome-msg"></h2>
        <div id="admin-approvals" style="margin-top:30px; border-top:1px solid #222; padding-top:20px; text-align:left;">
            <h3 style="color:var(--neon)">Squad Applications</h3>
            <div id="reg-list-box"><p style="color:#444">No pending squads.</p></div>
        </div>
        <hr style="border:none; border-top:1px solid #222; margin:24px 0;">
        <div id="moonboi-ctrl" style="display:none; border:2px solid gold; padding:20px; border-radius:20px">
            <h3 style="color:gold">HEAD ADMIN TOOLS</h3>
            <button class="btn-neon" onclick="generateNewKey()">⚡ GENERATE KEY</button>
            <div id="key-list-box" style="margin-top:15px"></div>
        </div>
    </div>
</div>

<div id="login-modal-overlay">
    <div id="login-modal">
        <h2>ADMIN LOGIN</h2>
        <input id="adm-u" placeholder="User"><input id="adm-p" type="password" placeholder="Pass">
        <button class="btn-neon" style="width:100%" onclick="login()">LOGIN</button>
    </div>
</div>

<script>
const SUPABASE_URL = 'https://yfsjflymbkbfiketvxof.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bOr8dIV2-Zt_9CUpboVsBQ_pzwpyRZw';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let isAdmin = false, currentTourneyId = null, teams = Array.from({length:32},(_,i)=>`Team ${i+1}`);

function initApp() {
    const s = localStorage.getItem('djy_session');
    if (s) { const u = JSON.parse(s); setLoggedIn(u.isHead, u.name); }
    loadData('upcoming');
}

function setLoggedIn(head, name) {
    isAdmin = true;
    document.getElementById('nav-login-btn').style.display = 'none';
    document.getElementById('nav-logout-btn').style.display = 'block';
    document.getElementById('nav-admin-btn').style.display = 'block';
    document.getElementById('welcome-msg').innerText = 'Welcome, ' + name;
    if (head) document.getElementById('moonboi-ctrl').style.display = 'block';
    fetchRegistrations();
}

async function login() {
    const u = document.getElementById('adm-u').value.trim();
    const p = document.getElementById('adm-p').value;
    if (u === 'moonboi' && p === '123') { saveSession(true, 'moonboi'); return; }
    const { data } = await _supabase.from('admin_accounts').select('*').eq('username', u).eq('password', p);
    if (data?.length) saveSession(false, u); else alert('Invalid');
}

function saveSession(head, name) {
    localStorage.setItem('djy_session', JSON.stringify({ isHead: head, name }));
    setLoggedIn(head, name);
    document.getElementById('login-modal-overlay').style.display = 'none';
    tab('admin');
}

function tab(id) {
    document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    if (id === 'admin') fetchRegistrations();
}

// ── REGISTRATION SYSTEM ──
async function submitRegistration() {
    const team = document.getElementById('reg-team-name').value.trim();
    const cap = document.getElementById('reg-captain-ign').value.trim();
    const { error } = await _supabase.from('team_registrations').insert([{ team_name: team, captain_ign: cap, status: 'pending' }]);
    if (error) alert(error.message);
    else { document.getElementById('reg-msg').innerText = '✓ Application Sent!'; fetchRegistrations(); }
}

async function fetchRegistrations() {
    if (!isAdmin) return;
    const { data } = await _supabase.from('team_registrations').select('*').eq('status', 'pending');
    const box = document.getElementById('reg-list-box');
    box.innerHTML = data?.length ? data.map(r => `
        <div class="manage-item">
            <div><strong>${r.team_name}</strong> (Cap: ${r.captain_ign})</div>
            <div>
                <button class="tc-btn live-btn" onclick="handleReg(${r.id}, 'accepted')">Accept</button>
                <button class="tc-btn finish-btn" onclick="handleReg(${r.id}, 'declined')">Decline</button>
            </div>
        </div>`).join('') : '<p style="color:#444">No pending teams.</p>';
}

async function handleReg(id, status) {
    await _supabase.from('team_registrations').update({ status }).eq('id', id);
    fetchRegistrations();
}

function logout() { localStorage.removeItem('djy_session'); location.reload(); }
function openLoginModal() { document.getElementById('login-modal-overlay').style.display = 'flex'; }
function closeLoginModal() { document.getElementById('login-modal-overlay').style.display = 'none'; }
async function loadData(f) { const { data } = await _supabase.from('tournaments').select('*').eq('status', f); document.getElementById('list-display').innerHTML = data?.map(t => `<div class="tourney-card"><h3>${t.title}</h3></div>`).join(''); }

// PASTE ALL YOUR ORIGINAL BRACKET RENDERING CODE BELOW THIS LINE...
</script>
</body>
</html>
